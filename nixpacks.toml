# Configuración de Nixpacks para Dokploy con PHP 8.4, Node.js 22 y PostgreSQL
[variables]
NIXPACKS_NODE_VERSION = "22"

[phases.setup]
nixPkgs = ["...", "php84", "php84Extensions.pdo_pgsql", "php84Extensions.pgsql"]

[phases.install]
cmds = [
  "mkdir -p /var/log/nginx && mkdir -p /var/cache/nginx",
  "composer install --ignore-platform-reqs",
  "npm install"
]
